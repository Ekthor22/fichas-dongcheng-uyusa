<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fichas técnicas DongCheng · Uyusa</title>
<meta name="theme-color" content="#ED1C24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de mostrador, directa y rápida: buscar, ver, descargar.
   IDEA: el catálogo impreso de ferretería con su ficha técnica arrancable.
   PICTURE: la ficha misma, con la misma cabecera y tabla roja del PDF.
   COLOUR and TYPE: rojo DongCheng #ED1C24 dominante, negro #1b1b1b de apoyo, blanco; Archivo.
   LAYOUT: barra de búsqueda arriba; lista a la izquierda y ficha a la derecha; en teléfono se apilan. */
:root{color-scheme:light dark;--red:#ED1C24;--bg:light-dark(#f3f3f2,#121212);--card:light-dark(#fff,#1d1d1d);--ink:light-dark(#1b1b1b,#f1f1f1);--mut:light-dark(#5f6368,#a8a8a8);--line:light-dark(#e3e3e3,#333);--soft:light-dark(#f6f6f6,#262626)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,"DejaVu Sans",Arial,sans-serif;overflow-x:clip}
header{background:#fff;color:#1b1b1b;border-bottom:4px solid var(--red)}
.top{max-width:1240px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px max(4vw,14px);flex-wrap:wrap}
.top img.dc{height:30px}.top img.uy{height:30px;margin-left:auto}
.bar{background:#1b1b1b;color:#fff}
.bar div{max-width:1240px;margin:auto;padding:8px max(4vw,14px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.bar b{font-weight:800;letter-spacing:.5px}
#install{margin-left:auto;background:var(--red);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:700 14px Archivo,Arial;cursor:pointer;min-height:40px}
main{max-width:1240px;margin:auto;padding:16px max(4vw,14px) 40px}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 280px;font:500 18px Archivo,Arial;padding:14px 16px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:52px}
.search input:focus{outline:none;border-color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px Archivo,Arial;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.count{color:var(--mut);font-size:14px;margin:8px 0}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
#list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 230px);overflow:auto;padding-right:4px}
.it{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;min-height:64px}
.it:hover,.it:focus-visible{border-left-color:var(--red);outline:none}
.it[aria-current=true]{border-left-color:var(--red);background:var(--soft)}
.it .th{width:56px;height:48px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.it .th img{max-width:100%;max-height:100%}
.it .th.ph img{width:80%;opacity:.35}
.it code{font:700 13px Archivo,Arial;color:var(--red)}
.it span{display:block;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:24px;color:var(--mut)}
.sheet{background:#fff;color:#1b1b1b;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 12px;border-bottom:3px solid var(--red);gap:12px}
.sh-head img{height:26px}
.sh-band{background:#1b1b1b;color:#fff;display:flex;justify-content:space-between;padding:7px 22px;font:800 12px Archivo,Arial;letter-spacing:3px}
.sh-band span:last-child{color:var(--red);letter-spacing:1px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;padding:18px 22px 8px;align-items:center}
.ref{color:var(--red);font-weight:800;font-size:13px}
.hero h1{font:800 clamp(20px,2.6vw,28px)/1.1 Archivo,Arial;margin:6px 0 8px;text-transform:uppercase;text-wrap:balance}
.desc{color:#5f6368;margin:0 0 8px;font-size:15px}
.tag{display:inline-block;background:#f2f2f2;color:#5f6368;border-radius:4px;padding:3px 9px;font-size:13px;margin:0 6px 4px 0}
.tag.t{background:#1b1b1b;color:#fff}
.pic{border:1px solid #e2e2e2;border-radius:8px;height:180px;display:flex;align-items:center;justify-content:center;padding:10px;background:#fff}
.pic img{max-width:100%;max-height:100%;object-fit:contain}.pic.ph img{width:60%;opacity:.3}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:6px 22px 4px}
.kpi{background:#f4f4f4;border-left:3px solid var(--red);padding:8px 10px}
.kpi b{display:block;color:var(--red);font-size:11px;text-transform:uppercase}
.kpi span{font-weight:800;font-size:17px}
.sheet h2{font:800 14px Archivo,Arial;text-transform:uppercase;margin:16px 22px 8px}
table{margin:0 22px;width:calc(100% - 44px);border-collapse:collapse;font-size:14px}
th{background:var(--red);color:#fff;text-align:left;padding:7px 10px;font-size:12px}
td{padding:7px 10px;border-bottom:1px solid #e6e6e6;vertical-align:top}
td:first-child{font-weight:700;color:#9e0f15;width:42%}
tr:nth-child(even) td{background:#fafafa}
.note{margin:10px 22px 0;font-size:13px;color:#5f6368}
.acts{display:flex;gap:10px;flex-wrap:wrap;padding:18px 22px}
.btn{border:0;border-radius:8px;padding:12px 18px;font:700 15px Archivo,Arial;cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.p{background:var(--red);color:#fff}.btn.s{background:#1b1b1b;color:#fff}.btn.g{background:#efefef;color:#1b1b1b}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #1b1b1b;outline-offset:2px}
.msg{font-size:14px;color:#5f6368;align-self:center}
.sh-foot{background:#1b1b1b;color:#cfcfcf;display:flex;justify-content:space-between;padding:10px 22px;font-size:12px;flex-wrap:wrap;gap:6px}
.sh-foot b{color:#fff}
#back{display:none}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}#list{max-height:none}.grid.show #list,.grid.show .count{display:none}.grid:not(.show) #detail{display:none}#back{display:inline-flex}.hero{grid-template-columns:minmax(0,1fr)}.pic{height:200px;order:-1}}
@media(max-width:600px){.top img.dc,.top img.uy{height:24px}.sh-head img{height:20px}.hero,.acts{padding-inline:14px}.kpis{padding-inline:14px}table{margin:0 14px;width:calc(100% - 28px);font-size:13px}.sheet h2{margin-inline:14px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header>
  <div class="top"><img class="dc" src="logo_dongcheng.svg" alt="DongCheng"><img class="uy" src="logo_uyusa.png" alt="Uyusa"></div>
  <div class="bar"><div><b>FICHAS TÉCNICAS</b><span id="total">Cargando catálogo…</span><button id="install" hidden>Instalar app</button></div></div>
</header>
<main>
  <div class="search">
    <input id="q" type="search" placeholder="SKU Uyusa, modelo o nombre (ej: DCPB488)" autocomplete="off" aria-label="Buscar ficha técnica">
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
  <div class="grid" id="grid">
    <div>
      <div class="count" id="count"></div>
      <div id="list" role="listbox" aria-label="Resultados"></div>
    </div>
    <div id="detail"></div>
  </div>
</main>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9/ .]/g, ' ');
const tight = s => norm(s).replace(/[^A-Z0-9]/g, '');
let DATA = [], cat = 'Todas', sel = null, downloads = null;
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const ORDER = ['Herramientas eléctricas','Herramientas inalámbricas','Kits inalámbricos','Baterías y cargadores','Motobombas','Medición','Herramientas manuales','Gatas hidráulicas','Accesorios','Repuestos'];

function score(d, q) {
  if (!q) return 1;
  const words = norm(q).split(/\s+/).filter(Boolean), tq = tight(q);
  const codes = [d.c, ...d.m].map(tight);
  let s = 0;
  if (codes.some(c => c === tq)) s += 100;
  else if (codes.some(c => c.startsWith(tq))) s += 60;
  else if (tq.length >= 3 && codes.some(c => c.includes(tq))) s += 40;
  const hay = d._h;
  if (words.every(w => hay.includes(w) || hay.replace(/ /g, '').includes(w.replace(/ /g, '')))) s += 20;
  return s;
}
function results() {
  const q = $('#q').value.trim();
  return DATA.filter(d => cat === 'Todas' || d.k === cat).map(d => [d, score(d, q)]).filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1] || ORDER.indexOf(a[0].k) - ORDER.indexOf(b[0].k) || a[0].n.localeCompare(b[0].n)).map(x => x[0]);
}
function thumb(d) {
  return d.i ? `<div class="th"><img src="img/${esc(d.i)}" alt="" loading="lazy"></div>` : `<div class="th ph"><img src="logo_dongcheng.svg" alt=""></div>`;
}
function renderList() {
  const r = results();
  $('#count').textContent = r.length ? `${r.length} ficha${r.length > 1 ? 's' : ''}${cat !== 'Todas' ? ' en ' + cat : ''}` : '';
  $('#list').innerHTML = r.length ? r.slice(0, 400).map(d => `<button class="it" role="option" data-c="${esc(d.c)}" aria-current="${sel && sel.c === d.c}">${thumb(d)}<div><code>${esc(d.c)}${d.m.length && d.m[0] !== d.c ? ' · ' + esc(d.m.join(' + ')) : ''}</code><span>${esc(d.n)}</span></div></button>`).join('')
    : `<div class="empty">No hay fichas para “${esc($('#q').value)}”. Prueba con el código sin guiones o con una palabra del nombre.</div>`;
  if (!sel && r.length && innerWidth > 820) show(r[0], false);
}
function show(d, mobile = true) {
  sel = d;
  document.querySelectorAll('.it').forEach(b => b.setAttribute('aria-current', b.dataset.c === d.c));
  const kp = d.p.length ? `<div class="kpis">${d.p.map(([a, v]) => `<div class="kpi"><b>${esc(a)}</b><span>${esc(v)}</span></div>`).join('')}</div>` : '';
  const rows = [['Código Uyusa', d.c], ['Marca', 'DongCheng'], ['Categoría', d.k], ['Descripción comercial', d.n], ...d.r];
  $('#detail').innerHTML = `<article class="sheet">
    <div class="sh-head"><img src="logo_dongcheng.svg" alt="DongCheng"><img src="logo_uyusa.png" alt="Uyusa"></div>
    <div class="sh-band"><span>FICHA TÉCNICA</span><span>${esc(d.c)}</span></div>
    <div class="hero"><div><div class="ref">${esc(d.c)} · DONGCHENG</div><h1>${esc(d.n)}</h1>${d.d ? `<p class="desc">${esc(d.d)}</p>` : ''}
      <span class="tag">${esc(d.k)}</span><span class="tag t">Ficha ${esc(d.t.toLowerCase())}</span>${d.m.length ? `<span class="tag">Modelo: ${esc(d.m.join(' + '))}</span>` : ''}</div>
      <div class="pic${d.i ? '' : ' ph'}"><img src="${d.i ? 'img/' + esc(d.i) : 'logo_dongcheng.svg'}" alt=""></div></div>
    ${kp}
    <h2>Especificaciones técnicas</h2>
    <table><tr><th>CARACTERÍSTICA</th><th>ESPECIFICACIÓN</th></tr>${rows.map(([a, v]) => `<tr><td>${esc(a)}</td><td>${esc(v)}</td></tr>`).join('')}</table>
    ${d.o ? `<p class="note">${esc(d.o)}</p>` : ''}
    <div class="acts">
      <button class="btn g" id="back">← Volver</button>
      <button class="btn p" id="dl">Descargar PDF</button>
      <a class="btn s" id="open" href="pdf/${encodeURIComponent(d.f)}.pdf" target="_blank" rel="noopener">Abrir PDF</a>
      <button class="btn g" id="copy">Copiar código</button>
      <span class="msg" id="msg" role="status"></span>
    </div>
    <div class="sh-foot"><span><b>Grupo Uyusa</b> · uyustools.cl</span><span>Herramientas DongCheng</span></div>
  </article>`;
  $('#back').onclick = () => { $('#grid').classList.remove('show'); scrollTo(0, 0) };
  $('#dl').onclick = () => download(d);
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(d.c); msg('Código copiado') } catch (e) { msg('No se pudo copiar') } };
  if (mobile && innerWidth <= 820) { $('#grid').classList.add('show'); scrollTo(0, 0) }
  store.set('fichas:last', d.c);
}
function msg(t) { const m = $('#msg'); if (m) m.textContent = t }
async function download(d) {
  const name = `Ficha Tecnica ${d.c.replace(/[\/\\]/g, '-')} DongCheng.pdf`, url = `pdf/${encodeURIComponent(d.f)}.pdf`;
  if (downloads) {
    try {
      msg('Preparando PDF…');
      const blob = await (await fetch(url)).blob();
      await downloads.save({ filename: name, data: blob }); msg('PDF descargado');
    } catch (e) {
      const c = e && e.code;
      msg(c === 'declined' ? 'Descarga cancelada' : c === 'rate_limited' ? 'Espera un momento y vuelve a intentar' : c === 'host_unavailable' ? 'Esta app no guarda archivos: usa "Abrir PDF" o un navegador' : 'Usa "Abrir PDF" para verlo y guardarlo');
    }
    return;
  }
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  msg('PDF descargado');
}
function chips() {
  const counts = {}; DATA.forEach(d => counts[d.k] = (counts[d.k] || 0) + 1);
  const cats = ['Todas', ...ORDER.filter(c => counts[c])];
  $('#chips').innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c === cat}" data-k="${esc(c)}">${esc(c)} <small>${c === 'Todas' ? DATA.length : counts[c]}</small></button>`).join('');
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; cat = b.dataset.k; chips(); sel = null; renderList() });
$('#list').addEventListener('click', e => { const b = e.target.closest('.it'); if (!b) return; show(DATA.find(d => d.c === b.dataset.c)) });
let t; $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { sel = null; store.set('fichas:q', $('#q').value); renderList() }, 120) });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const r = results(); if (r[0]) show(r[0]) } });

fetch('data.json').then(r => r.json()).then(j => {
  DATA = j.map(d => Object.assign(d, { _h: norm([d.c, d.m.join(' '), d.n, d.k, d.r.map(x => x[1]).join(' ')].join(' ')) }));
  $('#total').textContent = `${DATA.length} productos DongCheng del portal Uyusa`;
  $('#q').value = store.get('fichas:q') || '';
  chips(); renderList();
  const last = DATA.find(d => d.c === store.get('fichas:last'));
  if (last && innerWidth > 820) show(last, false);
}).catch(() => { $('#list').innerHTML = '<div class="empty">No se pudo cargar el catálogo. Revisa la conexión y recarga.</div>' });

if (window.claude && claude.use) claude.use('downloads').then(n => { downloads = n }).catch(() => {});
let deferred = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#install').hidden = false });
$('#install').addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('#install').hidden = true });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { try { navigator.serviceWorker.register('sw.js').catch(() => {}) } catch (e) {} }
}
</script>
</body>
</html>
